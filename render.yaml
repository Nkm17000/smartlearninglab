services:
  - type: web
    name: smartlearninglab-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: "https://smartlearninglab-react.onrender.com"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: "Smart Learning Lab"
      - key: BREVO_API_URL
        value: "https://api.brevo.com/v3/smtp/email"
      - key: PASSWORD_RESET_MINUTES
        value: "30"
      - key: EMAIL_VERIFICATION_HOURS
        value: "24"
      - key: FRONTEND_WEB_URL
        value: "https://smartlearninglab-react.onrender.com"
      - key: BACKEND_PUBLIC_URL
        value: "https://smartlearninglab.onrender.com"
      - key: FRONTEND_MOBILE_SCHEME
        value: "smartlearninglab://"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        sync: false
